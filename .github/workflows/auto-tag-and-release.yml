name: Auto Tag and Release

on:
  push:
    branches:
      - production

jobs:
  auto-release:
    name: Semantic Release with Slack Notification
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --save-dev \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/git \
            @semantic-release/exec

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: npx semantic-release
  send-email:
    needs: auto-release
    runs-on: ubuntu-latest
    if: ${{ needs.auto-release.result == 'success' }}
    steps:
      - name: Send release email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 New Production Release"
          to: ${{ secrets.RELEASE_TO_EMAILS }}
          cc: ${{ secrets.RELEASE_CC_EMAILS }}
          from: ${{ secrets.RELEASE_FROM_DISPLAY }}
          content_type: text/html
          html_body: |
            <h2>🎉 New Release Published</h2>
            <p><strong>📌 Branch:</strong> production</p>
            <p><strong>📦 Repository:</strong> <a href="https://github.com/${{ github.repository }}">https://github.com/${{ github.repository }}</a></p>
            <p><strong>🔗 Release URL:</strong> <a href="https://github.com/${{ github.repository }}/releases">View on GitHub Releases</a></p>
            <p><strong>📋 Workflow Run:</strong> <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>
            <p>This release was generated using <code>semantic-release</code>.</p>

  notify-on-failure:
    needs: send-email
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Release Email Failed"
          to: ${{ secrets.RELEASE_TO_EMAILS }}
          cc: ${{ secrets.RELEASE_CC_EMAILS }}
          from: ${{ secrets.RELEASE_FROM_DISPLAY }}
          content_type: text/plain
          body: |
            The release email step failed.
            Workflow: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
